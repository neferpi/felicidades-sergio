<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🎉 Felicidades Sergio 🎂</title>
<meta name="theme-color" content="#ff3d7f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(-45deg,#ff3d7f,#ff9f1c,#ffe14d,#2ec4b6,#7b2ff7,#ff3d7f);
  background-size:500% 500%;
  animation:bg 14s ease infinite;
  display:grid;place-items:center;cursor:pointer;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#balloons,#fx{position:fixed;inset:0;pointer-events:none}
#balloons{z-index:1}#fx{z-index:3}
h1{
  position:relative;z-index:2;text-align:center;line-height:.95;
  font-weight:900;letter-spacing:-.02em;padding:0 4vw;
  color:#fff;
  text-shadow:0 .06em 0 #7b2ff7,0 .12em 0 #ff3d7f,0 .2em .35em rgba(0,0,0,.25);
  animation:pop .9s cubic-bezier(.2,1.6,.4,1) both, bob 2.6s ease-in-out .9s infinite;
}
h1 .a{display:block;font-size:clamp(2.8rem,16vw,8rem)}
h1 .b{display:block;font-size:clamp(4rem,25vw,12rem);color:#ffe14d;
  text-shadow:0 .06em 0 #ff3d7f,0 .12em 0 #7b2ff7,0 .2em .35em rgba(0,0,0,.25)}
h1 .e{display:inline-block;font-size:clamp(2.4rem,12vw,6rem);margin-top:.15em;animation:wig 1.2s ease-in-out infinite}
h1 .e+.e{animation-delay:.6s}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes wig{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) scale(1.15)}}
.balloon{position:absolute;bottom:-160px;width:var(--w);height:calc(var(--w)*1.2);
  border-radius:50% 50% 48% 52%/55% 55% 45% 45%;
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.75) 0 8%,transparent 22%),var(--c);
  box-shadow:inset -8px -10px 0 rgba(0,0,0,.12);
  animation:rise var(--t) linear var(--d) infinite, sway 3s ease-in-out infinite alternate;opacity:.92}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:90px;background:rgba(255,255,255,.7);transform:translateX(-50%)}
.balloon::before{content:"";position:absolute;left:50%;top:98%;border:6px solid transparent;border-bottom-color:var(--c);transform:translateX(-50%) rotate(180deg)}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(calc(-100vh - 320px))}}
@keyframes sway{from{margin-left:-14px}to{margin-left:14px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="balloons" aria-hidden="true"></div>
<h1><span class="a">Felicidades</span><span class="b">Sergio</span><span class="e">🎉</span> <span class="e">🎂</span></h1>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
(()=>{
const C=["#ff3d7f","#ffe14d","#2ec4b6","#7b2ff7","#ff9f1c","#ffffff","#3a86ff"];
const bl=document.getElementById("balloons");
const n=innerWidth<600?9:16;
for(let i=0;i<n;i++){const b=document.createElement("div");b.className="balloon";
 const w=40+Math.random()*45;
 b.style.cssText=`left:${Math.random()*95}%;--w:${w}px;--c:${C[i%5===4?6:i%5]};--t:${9+Math.random()*9}s;--d:${-Math.random()*16}s`;
 bl.appendChild(b);}
const cv=document.getElementById("fx"),x=cv.getContext("2d");let W,H,D=Math.min(devicePixelRatio||1,2),P=[];
function rs(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0)}
rs();addEventListener("resize",rs);
function burst(px,py,k){for(let i=0;i<k;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*10;
 P.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,w:6+Math.random()*7,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:C[Math.random()*C.length|0],l:160+Math.random()*80,round:Math.random()<.3})}}
let run=false;
function tick(){x.clearRect(0,0,W,H);
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.vy+=.22;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l--;
  if(p.l<=0||p.y>H+40){P.splice(i,1);continue}
  x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.globalAlpha=Math.min(1,p.l/40);
  if(p.round){x.beginPath();x.arc(0,0,p.w/2.4,0,7);x.fill()}else{x.scale(1,Math.cos(p.l*.15));x.fillRect(-p.w/2,-p.h/2,p.w,p.h)}
  x.restore()}
 if(P.length)requestAnimationFrame(tick);else run=false}
function go(px,py,k){burst(px,py,k);if(!run){run=true;requestAnimationFrame(tick)}}
function party(){go(W*.2,H*.6,110);setTimeout(()=>go(W*.8,H*.6,110),180);setTimeout(()=>go(W/2,H*.4,140),380)}
addEventListener("load",party);
addEventListener("pointerdown",e=>go(e.clientX,e.clientY,90));
setInterval(()=>{if(!document.hidden)go(Math.random()*W,H*.3,50)},4500);
})();
</script>
</body>
</html>
